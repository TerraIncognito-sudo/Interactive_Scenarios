<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Host — Interactive Scenario</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="./host.css" />
  </head>
  <body class="host-body">
    <div class="conn" data-status="connecting" id="conn">connecting</div>

    <main class="console">
      <header class="head">
        <div>
          <p class="eyebrow">Hosting</p>
          <h1 class="show-title" id="show-title">—</h1>
        </div>
        <div class="room-chip">
          <span class="room-chip-label">Room</span>
          <span class="room-chip-code" id="room-code">------</span>
        </div>
      </header>

      <section class="strip">
        <div class="stat">
          <span class="stat-label">Status</span>
          <span class="stat-value" id="stat-phase">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Display</span>
          <span class="stat-value" id="stat-display">not connected</span>
        </div>
        <div class="stat">
          <span class="stat-label">Phones</span>
          <span class="stat-value" id="stat-players">0</span>
        </div>
      </section>

      <section class="now">
        <p class="eyebrow">On screen now</p>
        <p class="now-text" id="now-text">Waiting to start.</p>
        <p class="now-meta" id="now-meta"></p>
      </section>

      <section class="live" id="live" hidden>
        <div class="live-head">
          <p class="eyebrow">Live vote</p>
          <span class="live-clock" id="live-clock">--</span>
        </div>
        <ul class="tally" id="tally"></ul>
        <div class="override">
          <p class="override-label">Override — decide it yourself</p>
          <div class="override-buttons" id="override-buttons"></div>
        </div>
      </section>

      <section class="controls">
        <button id="btn-start" class="primary wide">Start the show</button>
        <div class="control-row">
          <button id="btn-back">Back</button>
          <button id="btn-pause">Pause</button>
          <button id="btn-skip">Skip</button>
        </div>
        <div class="control-row">
          <button id="btn-extend">+30s</button>
          <button id="btn-close">Close vote now</button>
        </div>
        <button id="btn-reset" class="danger">Reset to the beginning</button>
      </section>

      <section class="links">
        <p class="eyebrow">Links</p>
        <label class="link-row">
          <span>Display</span>
          <input id="link-display" readonly />
          <button data-copy="link-display">Copy</button>
        </label>
        <label class="link-row">
          <span>Join</span>
          <input id="link-join" readonly />
          <button data-copy="link-join">Copy</button>
        </label>
        <p class="warn" id="ready-warning" hidden>
          The display has not finished loading its assets yet.
        </p>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
