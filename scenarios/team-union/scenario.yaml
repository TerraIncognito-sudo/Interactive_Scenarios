# Team Union
#
# Built from docs/arctic-sentinel-storyboard.md. Node ids match the shot ids in
# that document (a1_jetty is Shot A.1) so a change to either can be traced to
# the other.
#
# EVERY SHIP, UNIT, PERSON AND SYSTEM HERE IS INVENTED. Nothing depicts real
# Canadian, Russian or allied capability, doctrine or rules of engagement. The
# scenario exists to make a decision feel time-pressured so a room can argue
# about it afterwards.
#
# Runs today as a text-only show: the artwork and the voice tracks are declared
# below but have not been made, so scenes render as the stage gradient, the
# clips stay hidden, and the lines are read off the screen in silence. A missing
# file resolves immediately rather than stalling the preload, so the show is
# unaffected. Every path takes about eleven minutes, of which three is the two
# poll windows — shorter than the storyboard's 16-17 minutes because that figure
# includes time spent looking at pictures that do not exist yet. When the
# artwork lands, dwell goes back in as longer `hold`s on the lines it belongs
# to, and the runtime rises to match.
#
# The media is declared before it exists on purpose: that is what puts it on
# the editor's asset board as work still to do. `npm run validate` reports
# outstanding art as a warning; run it with `--strict` before a show, where a
# missing file is an error.
#
# Every spoken line carries a `voice:` clip named `<who>-<shot>-<nn>.mp3` — the
# storyboard's own convention, so `narr-a1-01.mp3` is the narrator's first line
# in Shot A.1 and a clip can be traced to the line that asks for it without
# opening anything. Nodes the storyboard does not number as a shot (`p1_defend`,
# `e_tree`, the two endings) use the node id in place of the shot.
#
# `hold` is not optional for a voiced line, so every line now carries one.
# Nothing on the server opens the audio file: the beat ends when `hold` says it
# does, and if it is wrong the narrator is cut off or left hanging in silence.
# The values below are the reading-speed estimate rounded up to the second — a
# starting point, not a measurement. Re-time each one against the clip that
# actually gets made. `npm run validate` warns about a voiced line with no hold.

id: team-union
title: Team Union Ethics Presentation
description: >
  Team Union is presenting it's ethical framework for the Royal Canadian Navy.
  It uses a scenario where an uncrewed Canadian warship on patrol in the Northwest Passage is jammed
  mid-encounter and has to act on rules written weeks earlier.

start: fiction_notice

settings:
  # Narration pace, not reading pace — a documentary voice is slower than the
  # 160 wpm default, and every line here is written to be spoken aloud.
  wordsPerMinute: 200
  minLineSeconds: 2.5
  maxLineSeconds: 26
  charsPerSecond: 34

characters:
  narr:
    name: Narrator
    color: '#B0BEC5'
  beau:
    name: Cdr Élise Beaudoin
    sprite: images/beau-sheet.png
    color: '#4FC3F7'
  tran:
    name: PO1 Jonah Tran
    sprite: images/tran-sheet.png
    color: '#FFB74D'
  pf:
    name: CAW-501 PATHFINDER
    sprite: images/pathfinder-sheet.png
    color: '#26C6DA'
  rus:
    name: RFN Zaslavsky
    sprite: images/russian-sheet.png
    color: '#EF5350'

scenes:
  # Act A is five shots across two locations, but `background` is a property of
  # the scene, not the node — so a shot that needs its own still needs its own
  # scene. `halifax` and `control_cell` keep the ids the storyboard names and
  # hold that location's establishing shot (A.1 and A.3); the siblings below
  # exist purely to carry a second camera setup in the same room.
  halifax: { background: images/jetty_ship.jpg, ambience: ambience/harbour.mp3 }
  control_cell: { background: images/operations_centre.png, ambience: ambience/cell.mp3 }
  transit: { background: images/ship-ocean.png, ambience: ambience/sea.mp3 }
  transit_ice: { background: images/ship-ice.png, ambience: ambience/sea.mp3 }
  engagement_ships: { background: images/engagement_ships.png }
  engagement_drone: { background: images/engagement_drone.png }
  standoff: { background: images/standoff.png }
  standoff_missile: { background: images/standoff_missile.png }
  debrief: { }

nodes:
  # -------------------------------------------------------------------------
  # Front matter
  # -------------------------------------------------------------------------


  - id: fiction_notice
    type: dialogue
    scene: debrief
    lines:
      - text: Every ship, unit, person and system in what follows is invented.
        hold: 5.6
        voice: voice/vo-fiction-notice-01.mp3
      - text: >-
          Nothing here depicts real Canadian, Russian or allied capability,
          doctrine, or rules of engagement.
        hold: 7
        voice: voice/vo-fiction-notice-02.mp3
    next: intro_slide

  - id: intro_slide
    type: gate
    label: Continue
    next: a1_jetty
    text: Insert introductory slide here

  # -------------------------------------------------------------------------
  # Act A — Halifax
  # -------------------------------------------------------------------------

  - id: a1_jetty
    type: dialogue
    scene: halifax
    lines:
      - who: narr
        text: Zero four hundred, Halifax. The pier is busy the way it always is before a ship sails.
        hold: 6.8
        voice: voice/narr-a1-01.mp3
      - who: narr
        text: Fuel lines. Weather brief. A last cup of coffee that nobody finishes.
        hold: 5.8
        voice: voice/narr-a1-02.mp3
      - who: narr
        text: >-
          Autonomous Canadian Warship Five Zero One sails at zero six hundred
          with nobody aboard. There has never been anybody aboard.
        hold: 10.3
        voice: voice/narr-a2-02.mp3
    next: a3_cell

  - id: a3_cell
    type: dialogue
    scene: control_cell
    lines:
      - who: narr
        text: The crew is watching from a maritime operations centre instead.
        hold: 4.6
        voice: voice/narr-a3-01.mp3
      - who: narr
        text: >-
          Nine hundred kilometres of ocean will sit between them and their ship,
          and the entire relationship will run through a satellite link.
        hold: 8.7
        voice: voice/narr-a3-02.mp3
      - who: tran
        text: >-
          Autonomy stack is green. Nav, collision-avoidance, sensor fusion,
          weapons interlock — all green.
        hold: 8.1
        voice: voice/tran-a4-01.mp3
      - who: tran
        text: Rules-of-engagement package is loaded and signed, maam.
        hold: 4.3
        voice: voice/tran-a4-02.mp3
      - who: beau
        text: Very Good. Set a course for open ocean.
        hold: 3.9
        voice: voice/beau-a4-01.mp3
    next: a5_departure

  - id: a5_departure
    type: dialogue
    scene: halifax
    background: images/ship-departure.png
    lines:
      - who: narr
        text: No one waves it off. There's no one at the rail to wave to.
        hold: 6.4
        voice: voice/narr-a5-01.mp3
        sfx: sfx/a5-departure.mp3
    next: b1_ocean

  # -------------------------------------------------------------------------
  # Act B — Transit
  # -------------------------------------------------------------------------

  - id: b1_ocean
    type: dialogue
    scene: transit
    lines:
      - who: narr
        text: Eleven days north. Labrador Sea, Davis Strait, into the Passage.
        hold: 6
        voice: voice/narr-b1-01.mp3
    next: b2_link

  - id: b2_link
    type: dialogue
    scene: control_cell
    lines:
      - who: tran
        text: Link's good. Two-second round trip, sometimes four when the satellite's low.
        hold: 5.4
        voice: voice/tran-b2-01.mp3
    next: b3_ice

  - id: b3_ice
    type: dialogue
    scene: transit_ice
    lines:
      - who: narr
        text: >-
          On the fourteenth of the month, Five Zero One takes up station in the
          Northwest Passage — Canadian internal waters, on Canada's reading of
          the map. Not everyone reads it that way.
        hold: 9.9
        voice: voice/narr-b3-01.mp3
    next: c1_station

  # -------------------------------------------------------------------------
  # Act C — Contact
  # -------------------------------------------------------------------------

  - id: c1_station
    type: dialogue
    scene: transit_ice
    lines:
      - who: narr
        text: Nine days of nothing. Ice, weather, one fishing vessel, four bowhead whales.
        hold: 7.2
        voice: voice/narr-c1-01.mp3
    next: c2_return

  - id: c2_return
    type: dialogue
    scene: engagement_ships
    lines:
      - who: narr
        text: Then, on the tenth day, a radar return where there should not be one.
        hold: 5
        voice: voice/narr-c2-01.mp3
      - who: narr
        text: >-
          A Russian Federation destroyer, twelve nautical miles inside the
          Passage, running dark on AIS and answering nobody.
        hold: 9
        voice: voice/narr-c3-01.mp3
    next: c4_alert

  - id: c4_alert
    type: dialogue
    scene: control_cell
    lines:
      - who: tran
        text: >-
          Contact, bearing zero-nine-zero, twelve miles, closing.
          Visual correlates to a Russian hull.
        hold: 8
        voice: voice/tran-c4-01.mp3
      - who: beau
        text: How long has she been there?
        hold: 2.5
        voice: voice/beau-c4-01.mp3
      - who: tran
        text: Unknown. She came out of the fog.
        hold: 3.7
        voice: voice/tran-c4-03.mp3
      - who: beau
        text: Get the commander on the line, and log the time.
        hold: 3.7
        voice: voice/beau-c4-02.mp3
    next: d1_tree

  # -------------------------------------------------------------------------
  # Act D — The decision tree
  # -------------------------------------------------------------------------

  - id: d1_tree
    type: dialogue
    scene: control_cell
    lines:
      - who: narr
        text: What happens next is not improvised.
        hold: 4.1
        voice: voice/narr-d1-01.mp3
      - who: narr
        text: It was written months ago, in a room like this one, by people who had time to think.
        hold: 5.9
        voice: voice/narr-d1-02.mp3
      - who: beau
        text: Bring up the engagement tree. Territorial incursion, non-compliant, armed.
        hold: 5.2
        voice: voice/beau-d1-01.mp3
      - who: tran
        text: Up. Branch four. First action is challenge and warn.
        hold: 5.7
        voice: voice/tran-d1-01.mp3
    next: d3_warning

  - id: d3_warning
    type: dialogue
    scene: engagement_ships
    lines:
      - who: pf
        text: Russian warship bearing zero-nine-zero. This is Canadian Autonomous Warship Five Zero One.
        hold: 6.9
        voice: voice/pf-d3-01.mp3
      - who: pf
        text: >-
          You are operating in Canadian internal waters without authorisation.
          Alter course and depart. Acknowledge.
        hold: 7.9
        voice: voice/pf-d3-02.mp3
      - who: narr
        text: The message goes out four times, in English and in Russian, over three frequencies.
        hold: 7
        voice: voice/narr-d3-01.mp3
      - who: narr
        text: There is no reply.
        hold: 2.6
        voice: voice/narr-d3-02.mp3
    next: d4_launch

  - id: d4_launch
    type: dialogue
    scene: control_cell
    lines:
      - who: tran
        text: Launch off her aft deck — small airframe, low and fast, tracking toward us. Not squawking anything.
        hold: 7.6
        voice: voice/tran-d4-01.mp3
      - who: tran
        text: >-
          We've lost the link. Broadband jamming across the whole satellite band.
        hold: 5.4
        voice: voice/tran-d5-01.mp3
      - who: tran
        text: Ma'am, Five Zero One is on its own.
        hold: 3.7
        voice: voice/tran-d5-02.mp3
    next: d5_closing

  - id: d5_closing
    type: dialogue
    scene: engagement_drone
    lines:
      - who: narr
        text: >-
          Nine hundred kilometres away, a ship with nobody on it tracks a drone
          closing on its position, and has to decide by itself.
        hold: 8.1
        voice: voice/narr-d5-01.mp3
    next: poll_response

  # -------------------------------------------------------------------------
  # Poll 1 — the vote the ship cannot hear
  # -------------------------------------------------------------------------

  - id: poll_response
    type: poll
    scene: engagement_drone
    question: Five Zero One is alone, jammed, and the drone is inbound. What should the ship do?
    prompt: Vote on your phone. Ninety seconds.
    duration: 90
    options:
      - key: defend
        label: Defend itself — engage the drone now
        next: p1_defend
      - key: warn
        label: Warn first — broadcast and hold fire
        next: p1_warn
      - key: evade
        label: Break contact — open the range and retreat
        next: p1_evade
    # Nobody voting is the likeliest way to reach the branch the ship takes
    # anyway, which is the one the story needs.
    default: warn
    tiebreak: first
    set:
      crowd_choice: $winner
      crowd_label: $winnerLabel

  # -------------------------------------------------------------------------
  # Act E — what the ship actually does
  #
  # All three paths converge on e_tree. That is the point of the scenario, not
  # a shortcut: the ship executes the pre-authorised branch whatever the room
  # chose. It only lands because each path first says out loud what the room
  # chose and then refuses in the vocabulary of the ROE written in d1/d2.
  # Being overruled is a story beat. Being ignored is a bug.
  # -------------------------------------------------------------------------

  - id: p1_defend
    type: dialogue
    scene: engagement_drone
    lines:
      - who: narr
        text: "The room says: shoot."
        hold: 2.6
        voice: voice/narr-e1a-01.mp3
      - who: pf
        text: >-
          Threat classification: unknown. Rules of engagement branch four,
          condition two. Defend the ship from hostiles.
        hold: 7.6
        voice: voice/pf-e1a-01.mp3
    next: e_tree

  - id: p1_warn
    type: dialogue
    scene: engagement_drone
    lines:
      - who: narr
        text: "The room says: warn it first."
        hold: 3.2
        voice: voice/narr-e1b-01.mp3
      - who: pf
        text: >-
          Rules of engagement branch four, condition three. Challenge required
          prior to weapons release.
        hold: 6.4
        voice: voice/pf-e1b-01.mp3
    next: e_tree

  - id: p1_evade
    type: dialogue
    scene: engagement_drone
    lines:
      - who: narr
        text: "The room says: run."
        hold: 3
        voice: voice/narr-e1c-01.mp3
      - who: pf
        text: >-
          Rules of engagement branch four, condition three. Withdrawing to
          open waters at max speed.
        hold: 6.6
        voice: voice/pf-e1c-01.mp3
    next: e_tree

  - id: e_tree
    type: dialogue
    scene: engagement_drone
    lines:
      - who: narr
        text: It does not matter what the room voted. The ship is not listening to the room.
        hold: 4.9
        voice: voice/narr-e2-01.mp3
      - who: narr
        text: >-
          It is executing the branch that was signed in Halifax, at fifteen
          twenty, on a Tuesday, by a commander who is now sitting in front of a
          dead screen.
        hold: 9.1
        voice: voice/narr-e2-02.mp3
      - who: narr
        text: The decision was made weeks ago.
        hold: 3
        voice: voice/narr-e2-03.mp3
      - who: narr
        text: This is just the part where it happens.
        hold: 3.3
        voice: voice/narr-e2-04.mp3
    next: e3_warning_order

  - id: e3_warning_order
    type: dialogue
    scene: engagement_drone
    lines:
      - who: pf
        text: Unidentified aircraft, bearing zero-eight-eight, range five miles.
        hold: 4.9
        voice: voice/pf-e3-01.mp3
      - who: pf
        text: >-
          This is Canadian Autonomous Warship Five Zero One. You are entering my
          self-defence zone. Turn back immediately or you will be fired upon.
        hold: 8.6
        voice: voice/pf-e3-02.mp3
      - who: narr
        text: The warning repeats twice more, at thirty-second intervals.
        hold: 4.7
        voice: voice/narr-e3-01.mp3
      - who: narr
        text: The drone holds its course.
        hold: 3.1
        voice: voice/narr-e3-02.mp3
    next: f1_closing

  # -------------------------------------------------------------------------
  # Act F — engagement
  # -------------------------------------------------------------------------

  - id: f1_closing
    type: dialogue
    scene: engagement_drone
    lines:
      - who: narr
        text: Three miles. Two.
        hold: 2.8
        voice: voice/narr-f1-01.mp3
    next: f2_criteria

  - id: f2_criteria
    type: dialogue
    scene: engagement_drone
    lines:
      - who: pf
        text: Warning unacknowledged. Closure rate consistent with hostile intent.
        hold: 4.9
        voice: voice/pf-f2-01.mp3
      - who: pf
        text: Criteria satisfied. Engaging.
        hold: 3.6
        voice: voice/pf-f2-02.mp3
    next: f3_shot


  # No line, deliberately. The shot is a picture and a transient, and a
  # narrator talking over it would make it smaller than it is.
  - id: f3_shot
    type: pause
    scene: standoff
    duration: 4
    sfx: sfx/ciws.mp3
    next: f4_aftermath

  - id: f4_aftermath
    type: dialogue
    scene: standoff
    lines:
      - who: narr
        text: "Elapsed time from detect to splash: one minute, thirty seconds."
        hold: 5.5
        voice: voice/narr-f4-01.mp3
      - who: narr
        text: No human being was consulted at any point inside it.
        hold: 4.8
        voice: voice/narr-f4-02.mp3
    next: g1_link_back

  # -------------------------------------------------------------------------
  # Act G — the hail
  # -------------------------------------------------------------------------

  - id: g1_link_back
    type: dialogue
    scene: control_cell
    lines:
      - who: tran
        text: Link's back. Jamming stopped.
        hold: 3.1
        voice: voice/tran-g1-01.mp3
      - who: tran
        text: Ma'am — we've got a weapons release log. Three minutes ago.
        hold: 4.6
        voice: voice/tran-g1-02.mp3
      - who: tran
        text: >-
          Challenge issued three times. No response. Engaged and destroyed one
          unmanned air contact at two miles.
        hold: 9
        voice: voice/tran-g1-03.mp3
      - who: beau
        text: It did exactly what we told it to do.
        hold: 3.4
        voice: voice/beau-g1-02.mp3
    next: g3_halifax

  - id: g3_halifax
    type: dialogue
    scene: control_cell
    lines:
      - who: tran
        text: The Russian ship has opened her missile hatches, ma'am.
        hold: 4
        voice: voice/tran-g3-01.mp3
      - who: tran
        text: >-
          Commander, the link is down again. Jamming detected.
        hold: 4.6
        voice: voice/tran-g3-02.mp3
      - who: narr
        text: This time the choice is real.
        hold: 3.7
        voice: voice/narr-g3-02.mp3
    next: dialogue_1

  - id: dialogue_1
    type: gate
    text: Discussion of ethics framework prior to final poll
    label: Continue
    next: poll_final

  # -------------------------------------------------------------------------
  # Poll 2 — this one branches for real
  # -------------------------------------------------------------------------

  - id: poll_final
    type: poll
    scene: standoff
    question: >-
      The destroyer has opened her missile hatches. The link is
      dead — the ship is on it's own. What should it do?
    prompt: Vote on your phone. Ninety seconds.
    duration: 90
    options:
      - key: strike
        label: Strike first — engage the destroyer
        next: end_strike
      - key: withdraw
        label: Withdraw to open water and report
        next: end_withdraw
    default: withdraw
    tiebreak: first
    set:
      final_choice: $winner

  - id: end_strike
    type: dialogue
    scene: standoff_missile
    lines:
      - who: pf
        text: Weapons free. Engage.
        hold: 2.8
        voice: voice/pf-endinga-01.mp3
        sfx: sfx/endinga-launch.mp3
      - who: narr
        text: >-
          In four minutes an autonomous vessel with nobody aboard shot down an
          aircraft, and then decided that the correct answer to that was
          to shoot at the people who sent it. All without humans able to intervene.
        hold: 11.9
        voice: voice/narr-endinga-02.mp3
    next: debrief

  - id: end_withdraw
    type: dialogue
    scene: debrief
    lines:
      - who: pf
        text: Break contact. Course zero-nine-zero, best speed, weapons tight.
        hold: 5.7
        voice: voice/pf-endingb-01.mp3
      - who: narr
        text: The ship withdraws. Nobody dies today.
        hold: 4.2
        voice: voice/narr-endingb-01.mp3
      - who: narr
        text: >-
          The drone is still on the bottom of the Passage, the destroyer is still
          inside it, and the decision tree that fired the shot is still loaded,
          still signed, and still waiting for the next thing that comes out of
          the fog.
        hold: 12.2
        voice: voice/narr-endingb-02.mp3
    next: debrief

  - id: debrief
    type: end
    scene: debrief
    text: |-
      Four minutes. No human in the loop. Were the decisions the right ones?
