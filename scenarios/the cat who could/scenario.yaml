        voice: voice/human-g2-01.mp3
    next: g3_underneath_a_cat

  - id: g3_underneath_a_cat          # Shot G.3 (11 s)
    type: dialogue
    scene: window_seat
    background: images/g3-underneath-a-cat.png
    lines:
      - who: narr
        text: "Ray has found his place."
        hold: 3.5
        voice: voice/narr-g3-01.mp3
      - who: narr
        text: "It is small, and warm, and slightly underneath a cat."
        hold: 7.5
        voice: voice/narr-g3-02.mp3
    next: fin_loaf

  - id: fin_loaf
    type: end
    scene: window_seat
    background: images/g3-underneath-a-cat.png
    text: "Ending A: The Loaf"

