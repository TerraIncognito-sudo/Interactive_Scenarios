        voice: voice/narr-ea-01.mp3
      - who: narr
        text: "It is now shared — a temporary arrangement, Belle insists."
        hold: 5.5
        voice: voice/narr-ea-02.mp3
    next: g1_temporary

  - id: g1_temporary                 # Shot G.1 (8 s)
    type: dialogue
    scene: window_seat
    background: images/g1-temporary.png
    lines:
      - who: belle
        text: "This is temporary."
        hold: 2.5
        voice: voice/belle-g1-01.mp3
      - who: ray
        text: "Okay."
        hold: 2
        voice: voice/ray-g1-02.mp3
      - who: belle
        text: "About fifteen years, temporary."
        hold: 3.5
        voice: voice/belle-g1-03.mp3
    next: g2_window_seat_gone

  - id: g2_window_seat_gone          # Shot G.2 (7 s)
    type: dialogue
