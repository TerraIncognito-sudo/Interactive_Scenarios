    type: dialogue
    scene: living_room
    background: images/j1-one-lap.png
    lines:
      - who: narr
        text: "First, Ray runs one lap of the living room at full speed."
        hold: 5
        voice: voice/narr-j1-01.mp3
        sfx: sfx/paws-skitter-rug.mp3
      - who: narr
        text: "For morale."
        hold: 3
        voice: voice/narr-j1-02.mp3
    next: j2_the_deal

  - id: j2_the_deal                  # Shot J.2 (13 s)
    type: dialogue
    scene: living_room
    background: images/j2-the-deal.png
    lines:
      - who: narr
        text: "Then he collapses into Belle, who allows it, and pretends not to."
