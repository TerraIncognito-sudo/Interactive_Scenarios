services:
  interactive-scenario:
    build: .
    image: interactive-scenario:latest
    container_name: interactive-scenario
    restart: unless-stopped
    ports:
      - '8880:8880'
    environment:
      # Password for /new, where sessions are created. Leave unset and one is
      # generated and printed at startup (see: docker compose logs).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Usually leave this alone: links are derived from the address each
      # request arrives on, so browsing to the LAN IP gives LAN links and a
      # Cloudflare-proxied request gives scurrycat.ca links. Only set it when
      # the audience's address differs from the one the server can see.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ROOM_TTL_MINUTES: ${ROOM_TTL_MINUTES:-240}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # SQLite. Survives restarts so a live show is not lost to a redeploy.
      - scenario-data:/data
      # Scenarios are content, not code: mount them and you can add or edit a
      # scenario without rebuilding the image. Call POST /api/reload after.
      - ./scenarios:/app/scenarios:ro

volumes:
  scenario-data:
